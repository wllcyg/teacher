services:
  teacher-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: teacher-workbench-backend:latest
    container_name: teacher_backend
    restart: always
    ports:
      - "0.0.0.0:8001:8001"
    volumes:
      # 将 SQLite 数据库及历史数据持久化映射到宿主机根目录的 ./backend_data
      - ./backend_data:/app/data
      - ./backend/app:/app/app
    environment:
      - TZ=Asia/Shanghai
      - DATA_DIR=/app/data
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - AI_MODEL=${AI_MODEL:-qwen-flash}
    networks:
      - default
      - common-network

networks:
  default:
  common-network:
    external: true
